name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          sh tests/syntax-check.sh
          for file in tests/*.cjs; do node --check "$file"; done
          node -e "const f = require('fs'); for (const p of [...f.readdirSync('mods').flatMap((m) => ['mods/' + m + '/mod.json', 'mods/' + m + '/layout.json']), 'layouts/herdr-mods.json']) JSON.parse(f.readFileSync(p))"
          for file in scripts/*.sh; do sh -n "$file"; done
          awk -v from=workspace-status -v to=hheei-status -f scripts/patch-mod.awk layouts/herdr-mods.json > /dev/null
          awk -v name=probe -f scripts/patch-sidebar.awk layouts/herdr-mods.json > /dev/null
          awk -v mod=probe -f scripts/patch-panel.awk layouts/herdr-mods.json > /dev/null
      - name: Types
        run: |
          [ -f types/gpui-kit.d.ts ] || sh scripts/host-types-stub.sh > types/gpui-kit.d.ts
          npx -y -p typescript@5 tsc -p jsconfig.json
      - name: Tests
        run: |
          for file in tests/*.test.cjs; do node "$file"; done
          sh tests/install-smoke.sh
          sh tests/agent-ui-install.test.sh
