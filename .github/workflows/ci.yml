name: CI
on: [push, pull_request]
jobs:
  shell-and-mod:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          sh tests/syntax-check.sh mods/project-open/main.js \
            mods/agent-ui/main.js \
            mods/agent-ui/fixtures.js \
            mods/agent-ui/model.js \
            mods/agent-ui/state.js \
            mods/agent-ui/bridge/herdr-agent-ui.js \
            mods/agent-ui/bridge-source.js
          node --check tests/project-open.test.cjs
          node --check tests/agent-ui.test.cjs
          node --check tests/agent-ui-state.test.cjs
          node --check tests/agent-ui-bridge.test.cjs
          node --check tests/agent-ui-bridge-source.test.cjs
          node -e "const f=require('fs'); for(const p of ['mods/project-open/mod.json','mods/project-open/layout.json','mods/agent-ui/mod.json','mods/agent-ui/layout.json','layouts/herdr-mods.json']) JSON.parse(f.readFileSync(p))"
          sh -n scripts/install.sh
          sh -n scripts/tui.sh
          awk -v mods=mods -f scripts/compose-layout.awk layouts/herdr-mods.json > /dev/null
          awk -f scripts/patch-status.awk layouts/herdr-mods.json > /dev/null || [ $? -eq 3 ]
          awk -v name=probe -f scripts/patch-sidebar.awk layouts/herdr-mods.json > /dev/null
          awk -f scripts/demo-layout.awk layouts/herdr-mods.json > /dev/null
      - name: Behavior and layout tests
        run: |
          node tests/project-open.test.cjs
          node tests/agent-ui.test.cjs
          node tests/agent-ui-state.test.cjs
          node tests/agent-ui-bridge.test.cjs
          node tests/agent-ui-bridge-source.test.cjs
          node tests/layout-status.test.cjs
      - name: Installer test
        run: |
          sh tests/install-smoke.sh
          sh tests/agent-ui-demo-install.test.sh
